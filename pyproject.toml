[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylumagen"
version = "0.3.2"
description = "Async Python library for the Lumagen Radiance Pro RS-232 protocol, with direct-serial and ESPHome serial-proxy transports."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Frank Rosano" }]
keywords = ["lumagen", "radiance-pro", "home-assistant", "esphome", "video-processor", "rs232"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # Deliberately WITHOUT the [esphome] extra. That extra only adds
    # aioesphomeapi, and serialx imports it lazily (per URL scheme), so
    # omitting it removes no capability whenever the package is present for
    # another reason.
    #
    # It matters because Home Assistant pins aioesphomeapi exactly for its
    # own esphome integration (==44.21.0 as of HA 2026.5) and installs
    # custom-integration requirements into the same site-packages. Declaring
    # a looser range here (>=44.17.0, no upper bound) for a package we don't
    # own let the resolver move HA's pinned version, and rewriting a Cython
    # package's .so files under a running HA leaves a mixed set on disk —
    # observed as "APIConnection size changed" / "does not export expected C
    # function make_noise_packets" and a dead ESPHome integration.
    #
    # HA already guarantees aioesphomeapi is present whenever it's needed: an
    # esphome:// URL implies the ESPHome integration, which ships it. Users
    # outside HA opt in via the `esphome` extra below.
    "serialx>=1.7",
]

[project.optional-dependencies]
# For consumers outside Home Assistant: pulls in aioesphomeapi so
# `esphome://` URLs work out of the box. `pip install pylumagen[esphome]`.
esphome = ["serialx[esphome]>=1.7"]

[project.urls]
Homepage = "https://github.com/frankrosano/pylumagen"
Repository = "https://github.com/frankrosano/pylumagen"
Issues = "https://github.com/frankrosano/pylumagen/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pylumagen"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pylumagen",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "A",               # flake8-builtins
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
